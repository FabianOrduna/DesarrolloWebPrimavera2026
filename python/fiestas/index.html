    <div id="fiestas"></div>
    <script>
      const url_base = "http://127.0.0.1:8000";

      function leerFiestas() {
        const url_completa = url_base + "/fiestas";
        fetch(url_completa)
          .then((response) => response.json())
          .then((data) => {
            console.log(data);
            // Renderizar las fiestas en el DOM
            const fiestasDiv = document.getElementById("fiestas");
            fiestasDiv.textContent = JSON.stringify(data);
          })
          .catch((error) => console.error("Error:", error));
      }

  </body>
